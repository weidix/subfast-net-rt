[package]
name = "subfast-net-rt"
version = "0.1.0"
edition = "2024"

[features]
default = []
gpu = ["dep:wgpu"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
half = "2.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "29.0.4", optional = true, default-features = false, features = ["std", "wgsl", "metal"] }

[target.'cfg(all(not(target_os = "macos"), not(target_arch = "wasm32")))'.dependencies]
wgpu = { version = "29.0.4", optional = true, default-features = false, features = ["std", "wgsl", "vulkan"] }

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "roi-infer"
path = "src/bin/roi_infer.rs"

[[bin]]
name = "cpu-bench"
path = "src/bin/cpu_bench.rs"

[[bin]]
name = "gpu-bench"
path = "src/bin/gpu_bench.rs"
required-features = ["gpu"]
