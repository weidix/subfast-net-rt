[package]
name = "subfast-net-rt"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
half = "2.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.10"

[[bin]]
name = "roi-infer"
path = "src/bin/roi_infer.rs"

[[bin]]
name = "cpu-bench"
path = "src/bin/cpu_bench.rs"
